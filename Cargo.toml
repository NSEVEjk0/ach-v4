[workspace]
resolver = "2"
members = ["crates/ach-protocol", "crates/ach-runtime", "contracts/ach-v4", "contracts/test-usdc", "workers/private-netting"]

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
hex = "=0.4.3"
base64 = "=0.22.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[profile.dev]
debug = false

